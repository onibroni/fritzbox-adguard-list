name: Update FRITZ!Box DNS Blocklist

on:
  workflow_dispatch:

  schedule:
    - cron: "17 4 * * *"
      timezone: "Europe/Berlin"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: FRITZ!Box Liste erstellen
        run: python convert.py

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fritzbox.txt

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
            exit 0
          fi

          git commit -m "Update FRITZ!Box DNS blocklist"
          git push
